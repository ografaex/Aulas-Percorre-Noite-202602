<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>
    <!-- CSS embedded (embutido) -->
    <style>
        p{
            font-size: 500px;
                    
        }
        #gato {
            color: blue;
        }

        #cachorro {
            color: rgb(25, 219, 83);
        }

    </style>
    
</head>
<body>
    
    <!-- CSS inline é aquele que vai dentro da propria tag -->
    <p style="color: red; font-size: 200px;">Rafael</p>
    <p id="cachorro">Paçoca</p>
    <p id="gato">Jolyne</p>

</body>
</html>
